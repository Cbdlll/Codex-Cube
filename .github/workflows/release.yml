name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  publish-tauri:
    # Cap a hung build instead of burning runner minutes silently.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__
          releaseName: __VERSION__
          # Draft placeholder only: the real notes are attached by the
          # publish-release job from the tagged release commit message,
          # so no per-version text needs to be kept in sync here.
          releaseBody: |
            ${{ github.ref_name }} is building — release notes are attached once all platform builds finish.
          # Stay draft until every platform has uploaded: otherwise the
          # first finished job (usually Windows) publishes a release page
          # that looks like it is missing the macOS artifacts.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Publish only after all platform builds succeed, so the release page
  # never shows a partial asset list. Release notes come from the tagged
  # release commit message, so each release documents itself.
  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish release with notes from the release commit
        run: |
          git log -1 --format=%B "${{ github.ref_name }}" > /tmp/release-notes.txt
          cat /tmp/release-notes.txt
          gh release edit "${{ github.ref_name }}" --notes-file /tmp/release-notes.txt --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
